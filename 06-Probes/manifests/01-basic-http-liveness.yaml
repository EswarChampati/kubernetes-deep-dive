apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-http-liveness
spec: 
  replicas: 2
  selector:
    matchLabels: 
     app: web-liveness
  template: 
    metadata: 
      labels: 
        app: web-liveness
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.26
          ports: 
            - containerPort: 80
          livenessProbe: 
            httpGet: 
              path: / 
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
