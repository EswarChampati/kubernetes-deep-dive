apiVersion: apps/v1
kind: Deployment
metadata: 
  name: production-web
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      app: production-web
  template: 
    metadata: 
      labels: 
         app: production-web
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.27
          ports: 
            - containerPort: 80
          startupProbe: 
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe: 
            httpGet: 
              path: / 
              port: 80
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe: 
            httpGet: 
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata: 
  name: production-web
spec: 
  selector: 
    app: production-web
  ports: 
    - port: 80
      targetPort: 80