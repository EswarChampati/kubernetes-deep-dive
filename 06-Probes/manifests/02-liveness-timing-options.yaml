apiVersion: apps/v1
kind: Deployment
metadata: 
  name: timing-demo
spec: 
  selector: 
    matchLabels: 
      app: timing-demo
  template: 
    metadata: 
      labels: 
        app: timing-demo
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.27
          ports: 
            - containerPort: 80
          livenessProbe: 
            httpGet: 
              path: / 
              port: 80
            initialDelaySeconds: 20   # u cna check whether it executed after 20 seconds or not via kubectl logs -f deployment/<deploymentname>
            timeoutSeconds: 3
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 4
            terminationGracePeriodSeconds: 30

        
