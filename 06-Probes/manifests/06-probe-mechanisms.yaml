apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-mechanism
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: http-mechanism
  template: 
    metadata:
      labels:
        app: http-mechanism
    spec: 
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe: 
            httpGet: 
              path: /
              port: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-mechanism
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: tcp-mechanism
  template: 
    metadata:
      labels:
        app: tcp-mechanism
    spec: 
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe: 
            tcpSocket:
              port: 80 

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-mechanism
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: exec-mechanism
  template: 
    metadata:
      labels:
        app: exec-mechanism
    spec: 
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe: 
            exec: 
              command:  
                - /bin/sh
                - -c 
                - test -f /usr/share/nginx/html/index.html