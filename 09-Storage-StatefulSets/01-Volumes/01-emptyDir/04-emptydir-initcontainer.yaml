# Create a Pod with:
#   - One init container called prepare.
#   - Init container creates /work/bootstrap.txt.
#   - Main container mounts the same emptyDir volume.
#   - Main container reads the file generated by the init container.

#   Challenge: Why can the main container access a file created by the init container even though they are separate containers?
#   Expected: Both mount the same Pod-level emptyDir volume.

apiVersion: v1
kind: Pod
metadata: 
  name: emptydir-init
spec: 
  initContainers:
    - name: prepare
      image: busybox
      command: 
        - sh
        - -c
        - echo "created by init container" > /work/bootstrap.txt
      volumeMounts: 
        - name: work
          mountPath: /work
  
  containers: 
    - name: app
      image: busybox
      command: 
        - sh
        - -c 
        - cat /appreader/bootstrap.txt    # check this contents in the pods containers logs 

      volumeMounts:
        - name: work
          mountPath: /appreader 
  
  volumes: 
    - name: work
      emptyDir: {}