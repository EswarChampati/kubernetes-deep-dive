
# Question
#   Create one Pod with two containers:
#     - writer: writes the current date to /shared/messages.log every 5 seconds.
#     - reader: reads the same file every 10 seconds.
#     - Both containers must mount the same emptyDir volume.
#     - Use different mount paths only if you want to experiment with them.

# Mount the same volume in the writer at /writer-data and in the reader at /reader-data. Will both containers still access the same file?
# Expected: Yes. The mount paths can differ; the volume is the same.

apiVersion: v1
kind: Pod
metadata: 
  name: emptydir-shared
spec: 
  containers:
    - name: writer
      image: busybox:1.36
      command: 
        - sh 
        - -c
        - while true; do date >> /writer-data/messages.log; sleep 5; done
      volumeMounts: 
        - name: shared
          mountPath: /writer-data
       
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - while true; do tail -n 5 /reader-data/messages.log 2>/dev/null || true; sleep 10; done
      volumeMounts:
        - name: shared
          mountPath: /reader-data

  volumes:
    - name: shared
      emptyDir: {}