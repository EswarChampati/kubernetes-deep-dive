# Create a Pod with:
#   - A memory-backed emptyDir volume.
#   - Mount path /cache.
#   - medium: Memory.
#   - sizeLimit: 64Mi.
#   - Write a temporary cache file.

# Challenge: What happens if the application writes more data than the configured size limit?

# Expected: It cannot continue using the volume beyond the enforced limit; depending on usage and conditions,
# this can also contribute to memory pressure or container termination.

apiVersion: v1
kind: Pod
metadata: 
  name: emptydir-memory
spec: 
  containers:
    - name: app
      image: busybox
      command: 
        - sh
        - -c 
        - echo cache-data > /cache/cache.txt; sleep 3600 
      volumeMounts: 
        - name: cache
          mountPath: /cache

  volumes: 
    - name: cache
      emptyDir: 
        medium: Memory
        sizeLimit: 64Mi