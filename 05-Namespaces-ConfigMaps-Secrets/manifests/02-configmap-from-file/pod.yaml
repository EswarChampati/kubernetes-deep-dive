apiVersion: v1
kind: Pod
metadata: 
  name: employee-pod
spec: 
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts: 
        - name: config-volume
          mountPath: /app/config
  
  volumes:
    - name: config-volume
      configMap:  # Tells Kubernetes that this volume gets its data from a ConfigMap.
        name: employee-config