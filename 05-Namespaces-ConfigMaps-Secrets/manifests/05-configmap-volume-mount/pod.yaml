apiVersion: v1
kind: Pod
metadata: 
  name: nginx-config-pod
spec: 
  containers: 
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: nginx-config-volume
          mountPath: /usr/share/nginx/html
  
  volumes: 
    - name: nginx-config-volume
      configMap:
        name: nginx-config