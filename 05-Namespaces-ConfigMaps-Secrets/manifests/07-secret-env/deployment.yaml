apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
spec: 
  replicas: 2 
  selector: 
    matchLabels:
      app: backend
  template: 
    metadata: 
      labels: 
        app: backend
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.27
          envFrom: 
            - secretRef: 
                name: app-credentials