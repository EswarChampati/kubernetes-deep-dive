apiVersion: v1
kind: Pod
metadata: 
 name: secret-volume-pod
spec: 
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts: 
        - name: secret-volume
          mountPath: /etc/app/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret
