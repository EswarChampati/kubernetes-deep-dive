apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: 
            - "-text=Hello from backend"
            - "-listen=:5678"
          ports: 
            - containerPort: 5678