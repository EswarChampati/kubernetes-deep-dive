apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: hashicorp/http-echo:0.2.3
          args: 
            - "-text=Hello from API"
            - "-listen=:6789"
          ports:
            - containerPort: 6789

