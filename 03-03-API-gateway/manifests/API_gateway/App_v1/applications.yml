apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app-v1
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: app-v1
  template: 
    metadata:
      labels: 
        app: app-v1
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.21.6
          ports: 
            - containerPort: 80 
          command: ["/bin/sh", "-c"]
          args: 
            - | 
              echo "Application v1" > /usr/share/nginx/html/index.html;
              nginx -g 'daemon off;';

---

apiVersion: v1
kind: Service
metadata:
  name: app-v1-service
spec:
  type: ClusterIP
  selector: 
    app: app-v1
  ports: 
    - name: http
      port: 80
      targetPort: 80
  