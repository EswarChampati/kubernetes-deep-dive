apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: 
  name: app1-host-route
spec: 
  parentRefs:
    - name: company-gateway
  hostnames: 
    - app1.local
  rules: 
    - matches: 
        - path: 
            type: PathPrefix
            value: / 
      
      backendRefs: 
        - name: app-v1-service
          port: 80

---
