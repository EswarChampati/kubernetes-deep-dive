apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app-v2
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: app-v2
  template: 
    metadata:
      labels: 
        app: app-v2
    spec: 
      containers:
        - name: nginx
          image: nginx:1.21.6
          ports: 
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args: 
            - | 
              echo "Application V2" >  /usr/share/nginx/html/index.html;
              nginx -g 'daemon off;';

---
apiVersion: v1
kind: Service
metadata: 
  name: app-v2-service
spec:
  type: ClusterIP
  selector: 
    app: app-v2
  ports: 
    - name: http
      port: 80
      targetPort: 80