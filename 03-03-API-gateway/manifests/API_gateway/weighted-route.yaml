apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: 
  name: weighted-route
spec: 
  parentRefs: 
    - name: company-gateway
  hostnames: 
    - myapp.local
  rules: 
    - matches: 
        - path: 
            type: PathPrefix
            value: /
      backendRefs:
        - name: app-v1-service
          port: 80
          weight: 80
        - name: app-v2-service
          port: 80
          weight: 20
                        
  