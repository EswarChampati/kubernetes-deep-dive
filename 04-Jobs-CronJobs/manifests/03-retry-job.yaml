apiVersion: batch/v1
kind: Job
metadata:
  name: retry-job
spec: 
  backoffLimit: 3
  ttlSecondsAfterFinished: 100
  template: 
    spec: 
       containers: 
         - name: retry-container
           image: busybox:1.36
           command: 
             - /bin/sh
             - -c 
             - | 
                 echo "Executing task"
                 echo "Task failed"
                 exit 1 
       restartPolicy: Never