apiVersion: batch/v1
kind: Job
metadata:
  name: basic-job
spec: 
  template:
    spec: 
      containers: 
        - name: basic-container
          image: busybox:1.36
          command: 
            - /bin/sh
            - -c 
            - | 
                echo "Hello kubernetes"
                sleep 30 
                echo "Job completed Successfully"
      restartPolicy: Never
