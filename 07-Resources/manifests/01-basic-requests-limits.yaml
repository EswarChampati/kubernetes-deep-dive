apiVersion: apps/v1
kind: Deployment
metadata: 
  name: resource-demo
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: resource-demo
  template: 
    metadata: 
      labels: 
        app: resource-demo
    spec: 
      containers:
        - name: nginx
          image: nginx:1.27
          ports: 
            - containerPort: 80
          resources:
            requests: 
              cpu: "500m"
              memory: "256Mi"
            limits: 
              cpu: "500m"
              memory: "256Mi"