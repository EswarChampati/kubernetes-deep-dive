apiVersion: apps/v1
kind: Deployment
metadata: 
  name: resource-behavior
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: resource-behavior
  template: 
    metadata:
      labels:
        app: resource-behavior
    spec: 
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources: 
            requests:
              cpu: 200m
              memory: 256Mi
            limits: 
              cpu: 200m
              memory: 256Mi