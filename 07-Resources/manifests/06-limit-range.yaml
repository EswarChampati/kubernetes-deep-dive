apiVersion: v1
kind: Namespace
metadata: 
  name: limit-lab

---

apiVersion: v1
kind: LimitRange
metadata:
  name: container-resource-limits
  namespace: limit-lab
spec: 
  limits: 
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:  # it can be overriden whenwe mention the limits at container level 
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 100m
        memory: 128Mi
      max: 
        cpu: "1"
        memory: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-resource-demo
  namespace: limit-lab
spec:
  replicas: 1
  selector: 
    matchLabels: 
      app: default-resource-demo
  template: 
    metadata: 
      labels: 
        app: default-resource-demo
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80